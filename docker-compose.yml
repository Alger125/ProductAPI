version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productapi_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123! # Cambia esto por una contraseña más segura si lo deseas
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
